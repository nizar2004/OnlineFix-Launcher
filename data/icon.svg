<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7dff"/>
      <stop offset="0.55" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#4b3ad1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#241a63" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
    <rect x="32" y="32" width="448" height="260" rx="112" fill="url(#sheen)"/>
  </g>

  <!-- ring -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="14"/>

  <!-- play triangle -->
  <path d="M 218 176 Q 210 170 202 176 L 202 336 Q 210 342 218 336 L 330 266 Q 340 258 330 250 Z"
        fill="#ffffff"/>

  <!-- orbit spark -->
